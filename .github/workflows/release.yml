name: Publish validated release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches package version
        run: node -e "const p=require('./package.json'); if(process.env.GITHUB_REF_NAME!=='v'+p.version) process.exit(1)"
      - run: npm ci
      - run: npm test
      - run: npm run build:vercel
  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release notes for the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "Bean Dash ${GITHUB_REF_NAME} — World Relay" \
            --notes-file docs/RELEASE.md
