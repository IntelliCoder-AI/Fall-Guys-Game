name: Game checks
on: [push, pull_request]
jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify 50-level balance, progression, physics and multiplayer
        run: npm test
      - name: Simulate full Tour rooms and Endurance courses
        run: node tests/endurance.mjs
